<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  
  <!-- FONT  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Article preview component</title>

</head>
<body>
  <main>
    <article class="card">
      <img src="./images/drawers.jpg" alt="" class="card__img">
      <div class="card__body">
        <div class="card__content">
          <h1 class="card__title">
            Shift the overall look and feel by adding these wonderful 
            touches to furniture in your home
          </h1>
          <p class="card__description">
            Ever been in a room and felt like something was missing? Perhaps 
            it felt slightly bare and uninviting. I’ve got some simple tips 
            to help you make any room feel complete.
          </p>
        </div>
        <div class="card-footer">
          <div class="card-footer__profile">
            <img src="./images/avatar-michelle.jpg" alt="" class="card-footer__img">
            <div class="card-footer__name-and-date">
              <p class="card-footer__name">Michelle Appleton</p>
              <date class="card-footer__date">28 Jun 2020</date>
            </div>
          </div>
          <button class="card-footer__share-button button">
            <img src="./images/icon-share.svg" alt="">
          </button>
        </div>      
      </div>
    </article>
  </main>
</body>
</html>
